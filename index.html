<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HK Lamppost Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #111827; color: white; font-family: sans-serif; overflow: hidden; }
        #app { display: flex; height: 100vh; width: 100vw; position: relative; }
        #map { flex-grow: 1; height: 100%; background: #000; z-index: 1; width: 100%; }

        #menuToggle {
            position: absolute; top: 15px; left: 15px; z-index: 2000;
            background: #2563eb; color: white; border: none; padding: 10px 16px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: background 0.2s;
        }
        #menuToggle:hover { background: #1d4ed8; }
        @media (min-width: 768px) { #menuToggle { display: none; } } 

        #sidebar { 
            background: #1f2937; padding: 20px; display: flex; flex-direction: column; gap: 15px; 
            overflow-y: auto; z-index: 3000; box-shadow: 2px 0 10px rgba(0,0,0,0.5); 
            position: absolute; top: 0; left: 0; height: 100%; width: 85%; max-width: 360px;
            transform: translateX(-100%); transition: transform 0.3s ease-in-out;
        }
        #sidebar.open { transform: translateX(0); }
        @media (min-width: 768px) {
            #sidebar { position: relative; transform: translateX(0); width: 360px; max-width: 360px; }
        }

        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: #1f2937; }
        #sidebar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        
        .indicator { background: #374151; padding: 12px; border-radius: 8px; text-align: center; transition: all 0.2s; }
        .indicator:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; }
        .indicator-value { font-size: 1.25rem; font-weight: bold; }
        .indicator-label { font-size: 0.7rem; color: #d1d5db; text-transform: uppercase; margin-top: 5px; font-weight: 600; line-height: 1.2; }
        .leaflet-popup-content { color: #111827; } 
        
        .street-view-btn {
            display: block; margin-top: 10px; text-align: center; background-color: #2563eb;
            color: white !important; padding: 10px; border-radius: 6px; text-decoration: none;
            font-size: 0.9rem; font-weight: bold; transition: background-color 0.2s;
        }
        .street-view-btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div id="app">
        <button id="menuToggle">☰ Search & Filters</button>

        <div id="sidebar">
            <div class="flex justify-between items-center border-b border-gray-600 pb-2">
                <h1 class="text-xl font-bold">HK Lamppost Map</h1>
                <button id="closeMenuBtn" class="md:hidden text-gray-400 hover:text-white text-3xl font-bold leading-none">&times;</button>
            </div>
            
            <div id="status" class="text-sm text-yellow-400 font-semibold animate-pulse">
                Downloading dataset... please wait.
            </div>
            
            <!-- SINGLE SEARCH -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Search Database (Single)</label>
                <input type="text" id="searchInput" placeholder="Type ID, Street, or District..." 
                       class="w-full p-2.5 rounded bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 text-base" disabled>
            </div>

            <!-- FILTERS -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Network Filters</label>
                <div class="flex flex-col gap-2">
                    <select id="regionFilter" class="w-full p-2.5 rounded bg-gray-700 border border-gray-600 text-white text-base focus:outline-none focus:border-blue-500 disabled:opacity-50" disabled>
                        <option value="">All Regions</option>
                    </select>
                    <select id="exchFilter" class="w-full p-2.5 rounded bg-gray-700 border border-gray-600 text-white text-base focus:outline-none focus:border-blue-500 disabled:opacity-50" disabled>
                        <option value="">All Exchanges</option>
                    </select>
                    <select id="unitFilter" class="w-full p-2.5 rounded bg-gray-700 border border-gray-600 text-white text-base focus:outline-none focus:border-blue-500 disabled:opacity-50" disabled>
                        <option value="">All Units</option>
                    </select>
                </div>
            </div>

            <!-- SMART BATCH SEARCH (NEW SET LOGIC) -->
            <div>
                <label class="block text-sm font-medium text-blue-400 mb-1">Smart Batch Search</label>
                <textarea id="batchInput" rows="3" placeholder="Paste Lamppost IDs here (auto-detects any 5-digit code)..." 
                          class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500" disabled></textarea>
                <div class="flex gap-2 mt-2">
                    <button id="batchSearchBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded text-sm disabled:opacity-50" disabled>Scan & Filter</button>
                    <button id="clearBatchBtn" class="hidden flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-1.5 px-3 rounded text-sm">Clear Batch</button>
                </div>
            </div>
            
            <div>
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-1">Class Summary</h2>
                <div class="grid grid-cols-2 gap-2 mt-2" id="indicators"></div>
            </div>

            <div class="mt-auto pt-4 border-t border-gray-600">
                <button id="exportBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded transition-colors disabled:opacity-50 flex items-center justify-center gap-2" disabled>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export CSV <span id="exportCount" class="text-sm font-normal opacity-80">(0)</span>
                </button>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <script>
        proj4.defs("EPSG:2326","+proj=tmerc +lat_0=22.3121333333333 +lon_0=114.178555555556 +k=1 +x_0=836694.05 +y_0=819069.8 +ellps=intl +towgs84=-162.619,-276.959,-161.764,0.067753,-2.243649,-1.158828,-1.094246 +units=m +no_defs");

        const sidebar = document.getElementById('sidebar');
        document.getElementById('menuToggle').addEventListener('click', () => sidebar.classList.add('open'));
        document.getElementById('closeMenuBtn').addEventListener('click', () => sidebar.classList.remove('open'));

        const map = L.map('map', { maxZoom: 24, zoomControl: false, preferCanvas: true }).setView([22.3193, 114.1694], 11);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 24, attribution: '&copy; Lands Department' }).addTo(map);
        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/label/hk/tc/wgs84/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 24 }).addTo(map);

        const markers = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60, disableClusteringAtZoom: 18 });
        map.addLayer(markers);

        let globalData = [];
        let currentMapData = [];
        let currentTextSearch = '';
        let currentBatchSearch = new Set(); // Upgraded to Set for O(1) matching
        let currentClassFilter = null;
        let currentRegionFilter = '';
        let currentExchFilter = '';
        let currentUnitFilter = '';
        const markerCache = new Map();

        function formatClassName(cls) {
            if (cls === 'ON_CENTRAL_DIVIDER_HIGH') return 'CENTRAL DIVIDER (HIGH)';
            if (cls === 'ON_CENTRAL_DIVIDER_MEDIUM') return 'CENTRAL DIVIDER (MED)';
            if (cls === 'ON_BRIDGE') return 'ON BRIDGE (天橋)';
            return cls;
        }

        function populateDropdowns(data) {
            const regions = [...new Set(data.map(d => d.Region).filter(Boolean))].sort();
            const exchs = [...new Set(data.map(d => d.EXCHCODE).filter(Boolean))].sort();
            const units = [...new Set(data.map(d => d.Unit).filter(Boolean))].sort();

            const regionSelect = document.getElementById('regionFilter');
            regions.forEach(r => regionSelect.add(new Option(r, r)));

            const exchSelect = document.getElementById('exchFilter');
            exchs.forEach(e => exchSelect.add(new Option(e, e)));

            const unitSelect = document.getElementById('unitFilter');
            units.forEach(u => unitSelect.add(new Option(u, u)));

            regionSelect.disabled = false;
            exchSelect.disabled = false;
            unitSelect.disabled = false;
        }

        fetch('hk_lamppost_master.csv')
            .then(res => res.text())
            .then(csvText => {
                document.getElementById('status').innerText = "Parsing data & building cache...";
                document.getElementById('status').classList.replace('text-yellow-400', 'text-blue-400');
                
                Papa.parse(csvText, {
                    header: true, dynamicTyping: true, skipEmptyLines: true,
                    complete: function(results) {
                        globalData = results.data.filter(row => row.lat && row.lon).map((row, index) => {
                            row._uid = index; return row;
                        });
                        
                        populateDropdowns(globalData);
                        
                        document.getElementById('status').style.display = 'none';
                        document.getElementById('searchInput').disabled = false;
                        document.getElementById('batchInput').disabled = false;
                        document.getElementById('batchSearchBtn').disabled = false;
                        document.getElementById('exportBtn').disabled = false;
                        
                        updateDashboard();
                    }
                });
            });

        function updateDashboard() {
            let baseData = globalData;
            
            // Dropdowns
            if (currentRegionFilter) baseData = baseData.filter(row => row.Region === currentRegionFilter);
            if (currentExchFilter) baseData = baseData.filter(row => row.EXCHCODE === currentExchFilter);
            if (currentUnitFilter) baseData = baseData.filter(row => row.Unit === currentUnitFilter);

            // Single Search String
            if (currentTextSearch) {
                baseData = baseData.filter(row => {
                    const idStr = String(row.lamp_post_id || '').toLowerCase();
                    const streetStr = String(row.street || '').toLowerCase();
                    const districtStr = String(row.district || '').toLowerCase();
                    return idStr.includes(currentTextSearch) || streetStr.includes(currentTextSearch) || districtStr.includes(currentTextSearch);
                });
            }

            // Smart Batch Lookup (using highly optimized O(1) Set)
            if (currentBatchSearch && currentBatchSearch.size > 0) {
                baseData = baseData.filter(row => currentBatchSearch.has(String(row.lamp_post_id || '').trim().toLowerCase()));
            }

            const classCounts = {};
            baseData.forEach(row => {
                const lampClass = row.class || 'UNKNOWN';
                classCounts[lampClass] = (classCounts[lampClass] || 0) + 1;
            });
            const sortedClasses = Object.entries(classCounts).sort((a, b) => b[1] - a[1]).slice(0, 4);

            const indicatorsContainer = document.getElementById('indicators');
            indicatorsContainer.innerHTML = sortedClasses.map(([cls, count]) => {
                const isSelected = currentClassFilter === cls;
                const isDivider = cls.includes('CENTRAL_DIVIDER');
                const isBridge = cls === 'ON_BRIDGE';
                const baseColor = isDivider ? 'red' : (isBridge ? 'purple' : 'blue');
                const textClass = isDivider ? 'text-red-400' : (isBridge ? 'text-purple-400' : 'text-blue-400');
                const borderClass = isSelected ? `border-2 border-${baseColor}-400 bg-${baseColor}-900/30` : `border border-gray-600`;

                return `
                    <div class="indicator ${borderClass}" onclick="window.toggleClassFilter('${cls}')">
                        <div class="indicator-value ${textClass}">${count.toLocaleString()}</div>
                        <div class="indicator-label">${formatClassName(cls)}</div>
                    </div>
                `;
            }).join('');

            currentMapData = baseData;
            if (currentClassFilter) {
                currentMapData = currentMapData.filter(row => row.class === currentClassFilter);
            }

            document.getElementById('exportCount').innerText = `(${currentMapData.length})`;

            markers.clearLayers();
            let bounds = L.latLngBounds();
            const newMarkers = [];

            currentMapData.forEach(row => {
                let marker = markerCache.get(row._uid);
                
                if (!marker) {
                    const lampClass = row.class || 'UNKNOWN';
                    const isDivider = lampClass.includes('CENTRAL_DIVIDER');
                    const isBridge = lampClass === 'ON_BRIDGE';
                    const markerColor = isDivider ? '#ef4444' : (isBridge ? '#a855f7' : '#2563eb');
                    const fillColor = isDivider ? '#f87171' : (isBridge ? '#c084fc' : '#3b82f6');
                    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${row.lat},${row.lon}`;

                    let hk80 = proj4("EPSG:4326", "EPSG:2326", [row.lon, row.lat]);
                    let hk80_x = hk80[0].toFixed(1);
                    let hk80_y = hk80[1].toFixed(1);

                    marker = L.circleMarker([row.lat, row.lon], {
                        radius: 5, color: markerColor, fillColor: fillColor, fillOpacity: 0.9, weight: 1
                    }).bindPopup(`
                        <div style="font-family: sans-serif; min-width: 210px;">
                            <strong style="font-size: 1.1rem; color: #1d4ed8;">${row.lamp_post_id}</strong><br>
                            <strong>Region:</strong> ${row.Region || 'N/A'} | <strong>EXCH:</strong> ${row.EXCHCODE || 'N/A'}<br>
                            <strong>Unit:</strong> ${row.Unit || 'N/A'}<br>
                            <hr style="margin: 8px 0; border-top: 1px solid #ccc;">
                            <strong>Street:</strong> ${row.street || 'N/A'}<br>
                            <strong>District:</strong> ${row.district || 'N/A'}<br>
                            <strong>Class:</strong> <span style="color:${isDivider ? 'red' : (isBridge ? 'purple' : 'blue')}; font-weight:bold;">${formatClassName(lampClass)}</span>
                            
                            <div style="background: #f3f4f6; padding: 6px; border-radius: 4px; font-size: 0.75rem; color: #4b5563; margin-top: 8px;">
                                <div><strong style="color: #374151;">WGS84:</strong> ${row.lat.toFixed(5)}, ${row.lon.toFixed(5)}</div>
                                <div style="margin-top: 2px;"><strong style="color: #374151;">HK1980:</strong> ${hk80_x}, ${hk80_y}</div>
                            </div>

                            <a href="${streetViewUrl}" target="_blank" class="street-view-btn">🗺️ Open in Street View</a>
                        </div>
                    `);
                    markerCache.set(row._uid, marker);
                }
                newMarkers.push(marker);
                bounds.extend([row.lat, row.lon]);
            });

            markers.addLayers(newMarkers);

            if (currentMapData.length > 0 && (currentTextSearch || (currentBatchSearch && currentBatchSearch.size > 0) || currentClassFilter || currentRegionFilter || currentExchFilter || currentUnitFilter)) {
                map.flyToBounds(bounds, { padding: [50, 50], maxZoom: 18, duration: 1.5 });
            }
        }

        window.toggleClassFilter = function(cls) { currentClassFilter = (currentClassFilter === cls) ? null : cls; updateDashboard(); };
        document.getElementById('regionFilter').addEventListener('change', (e) => { currentRegionFilter = e.target.value; updateDashboard(); });
        document.getElementById('exchFilter').addEventListener('change', (e) => { currentExchFilter = e.target.value; updateDashboard(); });
        document.getElementById('unitFilter').addEventListener('change', (e) => { currentUnitFilter = e.target.value; updateDashboard(); });

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentTextSearch = e.target.value.toLowerCase().trim();
                updateDashboard();
            }, 350); 
        });

        // --- NEW O(1) SMART BATCH SET PARSING LOGIC ---
        document.getElementById('batchInput').addEventListener('input', (e) => {
            const input = e.target.value;
            
            // Match EXACTLY 5 alphanumeric characters bounded by spaces or line breaks
            const matches = input.match(/\b[a-zA-Z0-9]{5}\b/g);
            
            if (matches && matches.length > 0) {
                // Instantly load matches into an indexed Set for hyper-fast comparison
                currentBatchSearch = new Set(matches.map(id => id.toLowerCase()));
                document.getElementById('clearBatchBtn').classList.remove('hidden');
            } else {
                currentBatchSearch = new Set();
                if (!input.trim()) {
                    document.getElementById('clearBatchBtn').classList.add('hidden');
                }
            }
            updateDashboard();
        });

        document.getElementById('batchSearchBtn').addEventListener('click', () => {
            const event = new Event('input');
            document.getElementById('batchInput').dispatchEvent(event);
        });

        document.getElementById('clearBatchBtn').addEventListener('click', () => {
            document.getElementById('batchInput').value = '';
            document.getElementById('clearBatchBtn').classList.add('hidden');
            currentBatchSearch = new Set();
            updateDashboard();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (currentMapData.length === 0) return alert("No data available to export.");
            const exportData = currentMapData.map(row => {
                let hk80 = proj4("EPSG:4326", "EPSG:2326", [row.lon, row.lat]);
                return {
                    Lamppost_ID: row.lamp_post_id, Region: row.Region || '', Exchange: row.EXCHCODE || '',
                    Unit: row.Unit || '', Street: row.street || '', District: row.district || '',
                    Class: row.class || '', 
                    WGS84_Lat: row.lat.toFixed(6), 
                    WGS84_Lon: row.lon.toFixed(6),
                    HK1980_X: hk80[0].toFixed(2), 
                    HK1980_Y: hk80[1].toFixed(2)
                };
            });
            const csv = Papa.unparse(exportData);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", "HK_Lampposts_Filtered.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
