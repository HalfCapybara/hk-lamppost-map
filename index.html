<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Lamppost Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet MarkerCluster CSS & JS for handling 145k points -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <!-- PapaParse for reading the CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #111827; color: white; font-family: sans-serif; }
        #app { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 350px; background: #1f2937; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        #map { flex-grow: 1; height: 100%; background: #000; z-index: 1; }
        .indicator { background: #374151; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #4b5563; }
        .indicator-value { font-size: 1.5rem; font-weight: bold; color: #60a5fa; }
        .indicator-label { font-size: 0.8rem; color: #9ca3af; text-transform: uppercase; margin-top: 5px; }
        .leaflet-popup-content { color: #111827; } 
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h1 class="text-xl font-bold border-b border-gray-600 pb-2">HK Lamppost Map</h1>
            
            <!-- Status Indicator -->
            <div id="status" class="text-sm text-yellow-400 font-semibold animate-pulse">
                Downloading dataset... please wait.
            </div>
            
            <!-- Single Search Bar -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Search Database</label>
                <input type="text" id="searchInput" placeholder="Type ID, Street, or District..." 
                       class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" disabled>
            </div>

            <!-- Batch ID Search Box -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Batch ID Check (Paste List)</label>
                <textarea id="batchInput" rows="3" placeholder="Paste multiple IDs (from Excel, comma separated, or new lines)..." 
                          class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" disabled></textarea>
                <div class="flex gap-2 mt-2">
                    <button id="batchSearchBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors disabled:opacity-50" disabled>
                        Check IDs
                    </button>
                    <button id="clearBatchBtn" class="hidden flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded transition-colors">
                        Clear
                    </button>
                </div>
            </div>
            
            <!-- Indicators Grid -->
            <div>
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Class Summary (Top 4)</h2>
                <div class="grid grid-cols-2 gap-3" id="indicators">
                    <!-- Indicators injected here by JS -->
                </div>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <script>
        // 1. Initialize the Map
        const map = L.map('map', {
            maxZoom: 24, 
            zoomControl: false 
        }).setView([22.3193, 114.1694], 11);
        
        L.control.zoom({ position: 'topright' }).addTo(map);

        // 2. Add LandsD Basemap layer
        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png', {
            maxNativeZoom: 19,
            maxZoom: 24,
            attribution: '&copy; Lands Department'
        }).addTo(map);

        // 3. Add LandsD Traditional Chinese Labels layer
        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/label/hk/tc/wgs84/{z}/{x}/{y}.png', {
            maxNativeZoom: 19,
            maxZoom: 24
        }).addTo(map);

        // 4. Set up cluster group for performance
        const markers = L.markerClusterGroup({
            chunkedLoading: true,
            maxClusterRadius: 60,
            disableClusteringAtZoom: 18 
        });
        map.addLayer(markers);

        let globalData = [];

        // 5. Automatically fetch the CSV file on load
        fetch('hk_lamppost_145k_classified.csv')
            .then(response => {
                if (!response.ok) throw new Error("CSV file not found on server.");
                return response.text();
            })
            .then(csvText => {
                document.getElementById('status').innerText = "Parsing data...";
                document.getElementById('status').classList.replace('text-yellow-400', 'text-blue-400');
                
                Papa.parse(csvText, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        globalData = results.data.filter(row => row.lat && row.lon);
                        
                        document.getElementById('status').style.display = 'none';
                        document.getElementById('searchInput').disabled = false;
                        document.getElementById('batchInput').disabled = false;
                        document.getElementById('batchSearchBtn').disabled = false;
                        
                        renderDashboard(globalData);
                    }
                });
            })
            .catch(err => {
                const statusDiv = document.getElementById('status');
                statusDiv.classList.replace('text-yellow-400', 'text-red-500');
                statusDiv.classList.remove('animate-pulse');
                statusDiv.innerHTML = `<strong>Error:</strong> Could not load CSV. Ensure 'hk_lamppost_145k_classified.csv' is uploaded to your GitHub repository in the exact same folder as this HTML file.`;
            });

        // 6. Main render function for map points and indicators
        function renderDashboard(data) {
            markers.clearLayers();
            let bounds = L.latLngBounds();
            const classCounts = {};
            const newMarkers = [];

            data.forEach(row => {
                const lampClass = row.class || 'UNKNOWN';
                classCounts[lampClass] = (classCounts[lampClass] || 0) + 1;

                // Color code Central Divider vs Roadside
                const isDivider = lampClass.includes('CENTRAL_DIVIDER');
                const markerColor = isDivider ? '#ef4444' : '#2563eb'; // Red for divider, Blue for normal
                const fillColor = isDivider ? '#f87171' : '#3b82f6';

                const marker = L.circleMarker([row.lat, row.lon], {
                    radius: 5,
                    color: markerColor,
                    fillColor: fillColor,
                    fillOpacity: 0.9,
                    weight: 1
                }).bindPopup(`
                    <div style="font-family: sans-serif;">
                        <strong>ID:</strong> ${row.lamp_post_id}<br>
                        <strong>Street:</strong> ${row.street || 'N/A'}<br>
                        <strong>District:</strong> ${row.district || 'N/A'}<br>
                        <strong>Class:</strong> <span style="color:${isDivider ? 'red' : 'blue'}; font-weight:bold;">${lampClass}</span>
                    </div>
                `);
                
                newMarkers.push(marker);
                bounds.extend([row.lat, row.lon]);
            });

            markers.addLayers(newMarkers);

            if (data.length > 0) {
                map.flyToBounds(bounds, { padding: [50, 50], maxZoom: 18, duration: 1.5 });
            }

            const sortedClasses = Object.entries(classCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 4);

            const indicatorsContainer = document.getElementById('indicators');
            indicatorsContainer.innerHTML = sortedClasses.map(([cls, count]) => `
                <div class="indicator">
                    <div class="indicator-value ${cls.includes('CENTRAL_DIVIDER') ? 'text-red-400' : 'text-blue-400'}">${count.toLocaleString()}</div>
                    <div class="indicator-label">${cls}</div>
                </div>
            `).join('');
        }

        // 7. Handle Single Search
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.toLowerCase().trim();
            
            searchTimeout = setTimeout(() => {
                if (!query) {
                    renderDashboard(globalData);
                    return;
                }
                const filtered = globalData.filter(row => {
                    const idStr = String(row.lamp_post_id || '').toLowerCase();
                    const streetStr = String(row.street || '').toLowerCase();
                    const districtStr = String(row.district || '').toLowerCase();
                    return idStr.includes(query) || streetStr.includes(query) || districtStr.includes(query);
                });
                renderDashboard(filtered);
            }, 350); 
        });

        // 8. Handle Batch ID Search
        document.getElementById('batchSearchBtn').addEventListener('click', () => {
            const input = document.getElementById('batchInput').value;
            if (!input.trim()) return;

            // Split input by newlines, commas, or spaces
            const idsToSearch = input.split(/[\n,\s]+/)
                                     .map(id => id.trim().toLowerCase())
                                     .filter(id => id.length > 0);

            if (idsToSearch.length === 0) return;

            const filtered = globalData.filter(row => {
                const idStr = String(row.lamp_post_id || '').toLowerCase();
                return idsToSearch.includes(idStr);
            });

            renderDashboard(filtered);
            document.getElementById('clearBatchBtn').classList.remove('hidden');
        });

        // 9. Clear Batch Search
        document.getElementById('clearBatchBtn').addEventListener('click', () => {
            document.getElementById('batchInput').value = '';
            document.getElementById('clearBatchBtn').classList.add('hidden');
            renderDashboard(globalData);
        });
    </script>
</body>
</html>
