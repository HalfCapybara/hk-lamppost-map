<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Lamppost Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet MarkerCluster CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <!-- PapaParse for reading the CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #111827; color: white; font-family: sans-serif; }
        #app { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 350px; background: #1f2937; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        #map { flex-grow: 1; height: 100%; background: #000; z-index: 1; }
        .indicator { background: #374151; padding: 15px; border-radius: 8px; text-align: center; transition: all 0.2s ease-in-out; }
        .indicator:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .indicator-value { font-size: 1.5rem; font-weight: bold; }
        .indicator-label { font-size: 0.75rem; color: #d1d5db; text-transform: uppercase; margin-top: 5px; font-weight: 600; line-height: 1.2; }
        .leaflet-popup-content { color: #111827; }
        
        #lamppostList::-webkit-scrollbar { width: 6px; }
        #lamppostList::-webkit-scrollbar-track { background: #1f2937; }
        #lamppostList::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h1 class="text-xl font-bold border-b border-gray-600 pb-2">HK Lamppost Map</h1>
            
            <!-- Status Indicator -->
            <div id="status" class="text-sm text-yellow-400 font-semibold animate-pulse bg-gray-800 p-3 rounded border border-yellow-600">
                Downloading & parsing 145,000 records... (Background Task)
            </div>
            
            <!-- Single Search Bar -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Search Database</label>
                <input type="text" id="searchInput" placeholder="Type ID, Street, or District..." 
                       class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" disabled>
            </div>

            <!-- Batch ID Search Box -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Batch ID Check (Paste List)</label>
                <textarea id="batchInput" rows="3" placeholder="Paste multiple IDs (from Excel, comma separated, or new lines)..." 
                          class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" disabled></textarea>
                <div class="flex gap-2 mt-2">
                    <button id="batchSearchBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors disabled:opacity-50" disabled>
                        Check IDs
                    </button>
                    <button id="clearBatchBtn" class="hidden flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded transition-colors">
                        Clear
                    </button>
                </div>
            </div>
            
            <!-- Indicators Grid -->
            <div>
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-1">Class Summary (Click to Filter)</h2>
                <div class="grid grid-cols-2 gap-3 mt-2" id="indicators"></div>
            </div>

            <!-- Embedded List Section -->
            <div id="listSection" class="hidden flex-col gap-2 mt-2 pt-4 border-t border-gray-600">
                <div class="flex justify-between items-end mb-1">
                    <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Filtered List <span id="listCount" class="text-xs text-gray-500 normal-case ml-1"></span></h2>
                    <button id="copyListBtn" class="text-xs bg-gray-700 hover:bg-gray-600 text-white py-1 px-3 rounded transition-colors font-medium border border-gray-500">
                        Copy All IDs
                    </button>
                </div>
                <div id="lamppostList" class="bg-gray-800 rounded p-2 overflow-y-auto text-sm border border-gray-700" style="max-height: 250px;"></div>
            </div>

        </div>
        
        <div id="map"></div>
    </div>

    <script>
        // 1. Initialize Map with Canvas Renderer for extreme performance
        const map = L.map('map', { 
            maxZoom: 24, 
            zoomControl: false,
            preferCanvas: true // CRITICAL: Hardware acceleration for thousands of points
        }).setView([22.3193, 114.1694], 11);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 24, attribution: '&copy; Lands Department' }).addTo(map);
        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/label/hk/tc/wgs84/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 24 }).addTo(map);

        const markers = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60, disableClusteringAtZoom: 18 });
        map.addLayer(markers);

        let globalData = [];
        let currentTextSearch = '';
        let currentBatchSearch = [];
        let currentClassFilter = null;
        let currentMapData = [];
        
        // CRITICAL OPTIMIZATION: Cache to store pre-built map markers
        const markerCache = new Map();

        function formatClassName(cls) {
            if (cls === 'ON_CENTRAL_DIVIDER_HIGH') return 'CENTRAL DIVIDER (HIGH)';
            if (cls === 'ON_CENTRAL_DIVIDER_MEDIUM') return 'CENTRAL DIVIDER (MED)';
            return cls;
        }

        // 2. Fetch CSV using Web Workers
        Papa.parse('hk_lamppost_145k_classified.csv', {
            download: true,
            header: true, 
            dynamicTyping: true, 
            skipEmptyLines: true,
            worker: true,
            complete: function(results) {
                const statusDiv = document.getElementById('status');
                statusDiv.classList.replace('text-yellow-400', 'text-blue-400');
                statusDiv.innerText = "Building internal map cache... (One-time setup)";

                // Add a unique internal ID to each row for caching
                globalData = results.data.filter(row => row.lat && row.lon).map((row, index) => {
                    row._uid = index;
                    return row;
                });
                
                document.getElementById('searchInput').disabled = false;
                document.getElementById('batchInput').disabled = false;
                document.getElementById('batchSearchBtn').disabled = false;
                
                setTimeout(() => {
                    updateDashboard();
                    statusDiv.style.display = 'none';
                }, 100);
            },
            error: function() {
                const statusDiv = document.getElementById('status');
                statusDiv.classList.replace('text-yellow-400', 'text-red-500');
                statusDiv.classList.remove('animate-pulse');
                statusDiv.innerHTML = `<strong>Error:</strong> Could not load CSV. Check file name and server.`;
            }
        });

        // 3. Central Update Function
        function updateDashboard() {
            let baseData = globalData;
            
            // Text Search
            if (currentTextSearch) {
                baseData = baseData.filter(row => {
                    const idStr = String(row.lamp_post_id || '').toLowerCase();
                    const streetStr = String(row.street || '').toLowerCase();
                    const districtStr = String(row.district || '').toLowerCase();
                    return idStr.includes(currentTextSearch) || streetStr.includes(currentTextSearch) || districtStr.includes(currentTextSearch);
                });
            }
            
            // Batch Search
            if (currentBatchSearch.length > 0) {
                baseData = baseData.filter(row => currentBatchSearch.includes(String(row.lamp_post_id || '').toLowerCase()));
            }

            // Calculate Indicators
            const classCounts = {};
            baseData.forEach(row => {
                const lampClass = row.class || 'UNKNOWN';
                classCounts[lampClass] = (classCounts[lampClass] || 0) + 1;
            });
            const sortedClasses = Object.entries(classCounts).sort((a, b) => b[1] - a[1]).slice(0, 4);

            const indicatorsContainer = document.getElementById('indicators');
            indicatorsContainer.innerHTML = sortedClasses.map(([cls, count]) => {
                const isSelected = currentClassFilter === cls;
                const isDivider = cls.includes('CENTRAL_DIVIDER');
                const baseColor = isDivider ? 'red' : 'blue';
                const textClass = isDivider ? 'text-red-400' : 'text-blue-400';
                const borderClass = isSelected ? `border-2 border-${baseColor}-400 bg-${baseColor}-900/30` : `border border-gray-600 cursor-pointer hover:border-gray-400`;

                return `
                    <div class="indicator ${borderClass} cursor-pointer" onclick="window.toggleClassFilter('${cls}')">
                        <div class="indicator-value ${textClass}">${count.toLocaleString()}</div>
                        <div class="indicator-label">${formatClassName(cls)}</div>
                    </div>
                `;
            }).join('');

            // Apply Class Filter
            currentMapData = baseData;
            if (currentClassFilter) {
                currentMapData = currentMapData.filter(row => row.class === currentClassFilter);
            }

            // ⚡ SUPER FAST MARKER RENDERING ⚡
            markers.clearLayers();
            let bounds = L.latLngBounds();
            const newMarkers = [];

            currentMapData.forEach(row => {
                // Check if marker already exists in memory
                let marker = markerCache.get(row._uid);
                
                if (!marker) {
                    // Create it ONLY if it doesn't exist yet
                    const lampClass = row.class || 'UNKNOWN';
                    const isDivider = lampClass.includes('CENTRAL_DIVIDER');
                    const markerColor = isDivider ? '#ef4444' : '#2563eb';
                    const fillColor = isDivider ? '#f87171' : '#3b82f6';

                    marker = L.circleMarker([row.lat, row.lon], {
                        radius: 5, color: markerColor, fillColor: fillColor, fillOpacity: 0.9, weight: 1
                    }).bindPopup(`
                        <div style="font-family: sans-serif;">
                            <strong>ID:</strong> ${row.lamp_post_id}<br>
                            <strong>Street:</strong> ${row.street || 'N/A'}<br>
                            <strong>District:</strong> ${row.district || 'N/A'}<br>
                            <strong>Class:</strong> <span style="color:${isDivider ? 'red' : 'blue'}; font-weight:bold;">${formatClassName(lampClass)}</span>
                        </div>
                    `);
                    // Save to memory
                    markerCache.set(row._uid, marker);
                }
                
                newMarkers.push(marker);
                bounds.extend([row.lat, row.lon]);
            });

            markers.addLayers(newMarkers);

            if (currentMapData.length > 0 && (currentTextSearch || currentBatchSearch.length > 0 || currentClassFilter)) {
                map.flyToBounds(bounds, { padding: [50, 50], maxZoom: 18, duration: 1.5 });
            }

            // Render Embedded List (Max 100 to prevent HTML freezing)
            const listSection = document.getElementById('listSection');
            const lamppostList = document.getElementById('lamppostList');
            const listCount = document.getElementById('listCount');

            if (currentClassFilter || currentTextSearch || currentBatchSearch.length > 0) {
                listSection.classList.remove('hidden');
                listSection.classList.add('flex');
                
                const displayLimit = 100;
                const displayData = currentMapData.slice(0, displayLimit);
                
                if (currentMapData.length > displayLimit) {
                    listCount.innerText = `(showing first ${displayLimit} of ${currentMapData.length})`;
                } else {
                    listCount.innerText = `(${currentMapData.length} total)`;
                }

                lamppostList.innerHTML = displayData.map(row => `
                    <div class="border-b border-gray-700 py-1.5 last:border-0 flex justify-between">
                        <span class="text-blue-400 font-bold">${row.lamp_post_id}</span>
                        <span class="text-gray-400 truncate max-w-[180px]" title="${row.street || 'N/A'}">${row.street || 'N/A'}</span>
                    </div>
                `).join('');
            } else {
                listSection.classList.add('hidden');
                listSection.classList.remove('flex');
                lamppostList.innerHTML = '';
            }
        }

        window.toggleClassFilter = function(cls) {
            currentClassFilter = (currentClassFilter === cls) ? null : cls;
            updateDashboard();
        };

        document.getElementById('copyListBtn').addEventListener('click', () => {
            if (currentMapData.length === 0) return;
            const allIds = currentMapData.map(row => row.lamp_post_id).join('\n');
            navigator.clipboard.writeText(allIds).then(() => {
                const btn = document.getElementById('copyListBtn');
                const originalText = btn.innerText;
                btn.innerText = 'Copied!';
                btn.classList.replace('bg-gray-700', 'bg-green-600');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.replace('bg-green-600', 'bg-gray-700');
                }, 2000);
            });
        });

        // Increased delay slightly so typing is smoother
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentTextSearch = e.target.value.toLowerCase().trim();
                updateDashboard();
            }, 500); 
        });

        document.getElementById('batchSearchBtn').addEventListener('click', () => {
            const input = document.getElementById('batchInput').value;
            if (!input.trim()) return;
            currentBatchSearch = input.split(/[\n,\s]+/).map(id => id.trim().toLowerCase()).filter(id => id.length > 0);
            if (currentBatchSearch.length === 0) return;
            document.getElementById('clearBatchBtn').classList.remove('hidden');
            updateDashboard();
        });

        document.getElementById('clearBatchBtn').addEventListener('click', () => {
            document.getElementById('batchInput').value = '';
            document.getElementById('clearBatchBtn').classList.add('hidden');
            currentBatchSearch = [];
            updateDashboard();
        });
    </script>
</body>
</html>
