<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HK Lamppost Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #111827; color: white; font-family: sans-serif; overflow: hidden; }
        #app { display: flex; height: 100vh; width: 100vw; position: relative; }
        #map { flex-grow: 1; height: 100%; background: #000; z-index: 1; width: 100%; }

        #menuToggle {
            position: absolute; top: 15px; left: 15px; z-index: 2000;
            background: #2563eb; color: white; border: none; padding: 10px 16px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: background 0.2s;
        }
        #menuToggle:hover { background: #1d4ed8; }
        @media (min-width: 768px) { #menuToggle { display: none; } } 

        #sidebar { 
            background: #1f2937; padding: 20px; display: flex; flex-direction: column; gap: 15px; 
            overflow-y: auto; z-index: 3000; box-shadow: 2px 0 10px rgba(0,0,0,0.5); 
            position: absolute; top: 0; left: 0; height: 100%; width: 85%; max-width: 380px;
            transform: translateX(-100%); transition: transform 0.3s ease-in-out;
        }
        #sidebar.open { transform: translateX(0); }
        @media (min-width: 768px) {
            #sidebar { position: relative; transform: translateX(0); width: 380px; max-width: 380px; }
        }

        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: #1f2937; }
        #sidebar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        
        .indicator { background: #374151; padding: 10px; border-radius: 8px; text-align: center; transition: all 0.2s; }
        .indicator.clickable:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; }
        .indicator-value { font-size: 1.15rem; font-weight: bold; }
        .indicator-label { font-size: 0.65rem; color: #d1d5db; text-transform: uppercase; margin-top: 4px; font-weight: 600; line-height: 1.2; }
        .leaflet-popup-content { color: #111827; } 
        
        .street-view-btn {
            display: block; margin-top: 10px; text-align: center; background-color: #2563eb;
            color: white !important; padding: 10px; border-radius: 6px; text-decoration: none;
            font-size: 0.9rem; font-weight: bold; transition: background-color 0.2s;
        }
        .street-view-btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div id="app">
        <button id="menuToggle">☰ Search & Filters</button>

        <div id="sidebar">
            <div class="flex justify-between items-center border-b border-gray-600 pb-2">
                <h1 class="text-xl font-bold">HK Lamppost Map</h1>
                <button id="closeMenuBtn" class="md:hidden text-gray-400 hover:text-white text-3xl font-bold leading-none">&times;</button>
            </div>
            
            <div id="status" class="text-sm text-yellow-400 font-semibold animate-pulse">
                Downloading dataset... please wait.
            </div>
            
            <!-- SINGLE SEARCH -->
            <div>
                <input type="text" id="searchInput" placeholder="Search ID, Street, or District..." 
                       class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 text-sm" disabled>
            </div>

            <!-- FILTERS -->
            <div>
                <div class="flex flex-col gap-2">
                    <select id="regionFilter" class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white text-sm focus:outline-none focus:border-blue-500 disabled:opacity-50" disabled>
                        <option value="">All Regions</option>
                    </select>
                    <select id="exchFilter" class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white text-sm focus:outline-none focus:border-blue-500 disabled:opacity-50" disabled>
                        <option value="">All Exchanges</option>
                    </select>
                    <select id="unitFilter" class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white text-sm focus:outline-none focus:border-blue-500 disabled:opacity-50" disabled>
                        <option value="">All Units</option>
                    </select>
                </div>
            </div>

            <!-- SMART BATCH SEARCH -->
            <div>
                <label class="block text-sm font-medium text-blue-400 mb-1">Smart Batch Search</label>
                <textarea id="batchInput" rows="2" placeholder="Paste Lamppost IDs here (auto-detects 5 or 6 digit codes)..." 
                          class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 text-sm" disabled></textarea>
                <div class="flex gap-2 mt-2">
                    <button id="batchSearchBtn" class="hidden flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded text-sm disabled:opacity-50" disabled>Scan & Filter</button>
                    <button id="clearBatchBtn" class="hidden flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-1.5 px-3 rounded text-sm">Clear Batch</button>
                </div>
            </div>
            
            <!-- SUMMARIES -->
            <div class="space-y-4">
                <!-- Class Summary -->
                <div>
                    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Class Summary (Click to Filter)</h2>
                    <div class="grid grid-cols-2 gap-2" id="classIndicators"></div>
                </div>
                
                <div class="flex gap-4">
                    <!-- Region Summary -->
                    <div class="flex-1">
                        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Top Regions</h2>
                        <div class="grid grid-cols-2 gap-2" id="regionIndicators"></div>
                    </div>
                    <!-- Unit Summary -->
                    <div class="flex-1">
                        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Top Units</h2>
                        <div class="grid grid-cols-2 gap-2" id="unitIndicators"></div>
                    </div>
                </div>
            </div>

            <div class="mt-auto pt-4 border-t border-gray-600">
                <button id="exportBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded transition-colors disabled:opacity-50 flex items-center justify-center gap-2" disabled>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export CSV <span id="exportCount" class="text-sm font-normal opacity-80">(0)</span>
                </button>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <script>
        proj4.defs("EPSG:2326","+proj=tmerc +lat_0=22.3121333333333 +lon_0=114.178555555556 +k=1 +x_0=836694.05 +y_0=819069.8 +ellps=intl +towgs84=-162.619,-276.959,-161.764,0.067753,-2.243649,-1.158828,-1.094246 +units=m +no_defs");

        const sidebar = document.getElementById('sidebar');
        document.getElementById('menuToggle').addEventListener('click', () => sidebar.classList.add('open'));
        document.getElementById('closeMenuBtn').addEventListener('click', () => sidebar.classList.remove('open'));

        const map = L.map('map', { maxZoom: 24, zoomControl: false, preferCanvas: true }).setView([22.3193, 114.1694], 11);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 24, attribution: '&copy; Lands Department' }).addTo(map);
        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/label/hk/tc/wgs84/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 24 }).addTo(map);

        const markers = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60, disableClusteringAtZoom: 18 });
        map.addLayer(markers);

        let globalData = [];
        let currentMapData = [];
        let currentTextSearch = '';
        let currentBatchSearch = new Set();
        let currentClassFilter = null;
        let currentRegionFilter = '';
        let currentExchFilter = '';
        let currentUnitFilter = '';
        const markerCache = new Map();

        function formatClassName(cls) {
            if (cls === 'ON_CENTRAL_DIVIDER_HIGH') return 'DIVIDER (HI)';
            if (cls === 'ON_CENTRAL_DIVIDER_MEDIUM') return 'DIVIDER (MED)';
            if (cls === 'ON_BRIDGE') return 'ON BRIDGE';
            return cls;
        }

        function populateDropdowns(data) {
            const regions = [...new Set(data.map(d => d.Region).filter(Boolean))].sort();
            const exchs = [...new Set(data.map(d => d.EXCHCODE).filter(Boolean))].sort();
            const units = [...new Set(data.map(d => d.Unit).filter(Boolean))].sort();

            const regionSelect = document.getElementById('regionFilter');
            regions.forEach(r => regionSelect.add(new Option(r, r)));

            const exchSelect = document.getElementById('exchFilter');
            exchs.forEach(e => exchSelect.add(new Option(e, e)));

            const unitSelect = document.getElementById('unitFilter');
            units.forEach(u => unitSelect.add(new Option(u, u)));

            regionSelect.disabled = false;
            exchSelect.disabled = false;
            unitSelect.disabled = false;
        }

        fetch('hk_lamppost_master.csv')
            .then(res => res.text())
            .then(csvText => {
                document.getElementById('status').innerText = "Parsing data & building cache...";
                document.getElementById('status').classList.replace('text-yellow-400', 'text-blue-400');
                
                Papa.parse(csvText, {
                    header: true, dynamicTyping: true, skipEmptyLines: true,
                    complete: function(results) {
                        globalData = results.data.filter(row => row.lat && row.lon).map((row, index) => {
                            row._uid = index; return row;
                        });
                        
                        populateDropdowns(globalData);
                        
                        document.getElementById('status').style.display = 'none';
                        document.getElementById('searchInput').disabled = false;
                        document.getElementById('batchInput').disabled = false;
                        document.getElementById('batchSearchBtn').disabled = false;
                        document.getElementById('exportBtn').disabled = false;
                        
                        updateDashboard();
                    }
                });
            });

        function updateDashboard() {
            let baseData = globalData;
            
            // Apply Filters
            if (currentRegionFilter) baseData = baseData.filter(row => row.Region === currentRegionFilter);
            if (currentExchFilter) baseData = baseData.filter(row => row.EXCHCODE === currentExchFilter);
            if (currentUnitFilter) baseData = baseData.filter(row => row.Unit === currentUnitFilter);

            if (currentTextSearch) {
                baseData = baseData.filter(row => {
                    const idStr = String(row.lamp_post_id || '').toLowerCase();
                    const streetStr = String(row.street || '').toLowerCase();
                    const districtStr = String(row.district || '').toLowerCase();
                    return idStr.includes(currentTextSearch) || streetStr.includes(currentTextSearch) || districtStr.includes(currentTextSearch);
                });
            }

            if (currentBatchSearch && currentBatchSearch.size > 0) {
                baseData = baseData.filter(row => currentBatchSearch
